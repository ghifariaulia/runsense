services:
  backend:
    build: ./backend
    ports:
      - "8081:8081"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8081 --reload

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "4321:4321"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
