services:
  backend:
    build: ./backend
    ports:
      - "8081:8081"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    ports:
      - "4321:4321"
    depends_on:
      - backend
    restart: unless-stopped
